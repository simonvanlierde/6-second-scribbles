# compose.prod.yml - Docker Compose overrides for production environment
# spell-checker: ignore tmpfs, gosu
name: 6ss-prod

# Rotate container logs: Docker keeps json-file logs forever by default. Caddy's
# access log holds visitor networks (IPs masked in frontend/Caddyfile). 3 x 10 MB
# per container.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

# For every container below except the database: the root filesystem is read-only and
# every Linux capability is dropped. A hijacked process then cannot regain root through a
# setuid binary or change the image. Postgres keeps its defaults: its entrypoint starts as
# root and needs SETUID, SETGID and CHOWN to switch user and run initdb.
x-hardening: &hardening
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:

  backend:
    !!merge <<: *hardening
    logging: *logging
    build:
      target: prod
    restart: unless-stopped
    env_file:
      - backend/.env.prod
    # Select the production config profile (Secure cookies + strict CORS checks).
    # Set explicitly here so it holds even if .env.prod omits it.
    environment:
      ENV: prod
      # Uvicorn reads X-Forwarded-Proto only from 127.0.0.1 by default, so behind
      # Caddy it built its trailing-slash redirects as http:// and browsers blocked
      # them (POST /api/rooms -> 307 http://.../api/rooms/). The backend is reachable
      # only on the compose network, through Caddy.
      FORWARDED_ALLOW_IPS: "*"
    # Require database migrations to complete before the backend starts.
    depends_on:
      database-migrations:
        condition: service_completed_successfully
    # Hard resource caps so a traffic/abuse spike gets OOM-killed and restarted
    # instead of taking down the host. Tune to the target machine.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    # Each WebSocket holds a file descriptor, and Python keeps Docker's soft limit of
    # 1024, which turned players away at about 1000 connections with CPU to spare.
    # Caddy and cloudflared, as Go programs, raise theirs to the hard limit themselves.
    ulimits:
      nofile: 65536

  cache:
    !!merge <<: *hardening
    logging: *logging
    # Started as the image's redis user, the entrypoint skips its switch from root,
    # which is what needed capabilities.
    user: redis
    # Room state and sessions live here. The volume keeps Redis's snapshot through a
    # host reboot or a recreated container.
    volumes:
      - cache_data:/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

  database:
    logging: *logging
    restart: unless-stopped
    # The entrypoint drops from root to postgres with gosu, which uses the default
    # SETUID and SETGID capabilities, not a setuid bit, so no-new-privileges does not
    # block it. The pids cap stops a fork bomb from exhausting the host's process table.
    security_opt:
      - no-new-privileges:true
    env_file:
      - backend/.env.prod
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
          pids: 512

  database-migrations:
    !!merge <<: *hardening
    build:
      target: db-migrations
    restart: "no"
    env_file:
      - backend/.env.prod
    environment:
      ENV: prod

  # One-off seeding job. Gated behind the `db-seed` profile so it never
  # starts on a normal `up`; invoke on demand with:
  #   docker compose -f compose.yml -f compose.prod.yml --profile db-seed \
  #     run --rm --build database-seed [python scripts/seed_data.py --overwrite|--append]
  # No source mount (unlike dev): the seed YAML baked into the image at build
  # time is used, keeping prod seeds reproducible.
  database-seed:
    !!merge <<: *hardening
    build:
      context: ./backend
      target: db-seed
    restart: "no"
    depends_on:
      database:
        condition: service_healthy
      database-migrations:
        condition: service_completed_successfully
    environment:
      POSTGRES_HOST: database
      # --overwrite clears the category caches here; unreachable only logs a warning.
      REDIS_HOST: cache
      ENV: prod
    env_file:
      - backend/.env.prod
    profiles:
      - db-seed

  frontend:
    !!merge <<: *hardening
    logging: *logging
    build:
      target: prod
    # Caddy runs as uid 10001 (frontend/Dockerfile) with no capabilities. Port 80, the
    # tunnel's target, stays: this namespaced sysctl lets an unprivileged process bind
    # it inside the container's own network namespace only. Caddy writes its autosaved
    # config and state to /config and /data, so those tmpfs mounts belong to that uid.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    tmpfs:
      - /tmp
      - /config:uid=10001,gid=10001
      - /data:uid=10001,gid=10001
    restart: unless-stopped
    # Bind to loopback only: the Cloudflare tunnel reaches the frontend over the
    # internal Docker network (service name `frontend`), so the host port does not
    # need to be on 0.0.0.0. Docker publishes ports by editing iptables directly,
    # bypassing the host firewall, so a 0.0.0.0 bind would expose the app on the
    # LAN/WAN and let clients reach the backend /api proxy without going through
    # Cloudflare. Loopback keeps the tunnel as the only external ingress.
    ports:
      - "127.0.0.1:80:80"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128m

  cloudflared:
    !!merge <<: *hardening
    logging: *logging
    # Pinned by tag and digest, so a deploy is reproducible and Dependabot has a
    # version to compare when it proposes the next release.
    image: cloudflare/cloudflared:2026.10.1@sha256:a15a3b50b8dabd57ac2090e9484c0247dba9dfa1f0df4d298d4317f9d69eb2d5
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_started
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    command: ["tunnel", "--no-autoupdate", "run"]
    profiles:
      - tunnel

volumes:
  cache_data:

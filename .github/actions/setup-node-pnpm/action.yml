name: 'Setup Node and pnpm'
description: 'Installs pnpm and Node.js in a single step.'
runs:
  using: 'composite'
  steps:
    # pnpm/setup installs both pnpm and the Node runtime, taking the pnpm version
    # from package.json's `packageManager` field. It replaces the older
    # corepack-then-setup-node pair: Node 25+ no longer bundles Corepack, so
    # `corepack enable` is not something CI can rely on being present.
    # `install: false` keeps dependency installation in the calling workflow,
    # which installs per-package (root vs. frontend) rather than always at root.
    - name: Setup pnpm and Node
      uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
      with:
        runtime: node@${{ inputs.node-version }}
        cache: true
        cache-dependency-path: pnpm-lock.yaml
        install: false

inputs:
  node-version:
    description: 'Node.js version'
    required: false
    default: '26'

name: CI

# No push trigger: main only advances through a PR, so a push run repeats
# the check that already passed on the PR head.
on:
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.pull_request.draft == false || github.event_name != 'pull_request'
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      contracts: ${{ steps.filter.outputs.contracts }}
      root: ${{ steps.filter.outputs.root }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'
            contracts:
              - 'contracts/**'
              - 'backend/app/rooms/protocol.py'
              - 'backend/app/*/schemas.py'
              - 'backend/scripts/generate_contracts.py'
              - 'frontend/scripts/generate-contracts.mjs'
              - 'scripts/check-contracts.mjs'
              - 'package.json'
              - 'frontend/package.json'
              - 'pnpm-lock.yaml'
              - 'justfile'
              - 'backend/justfile'
              - 'frontend/justfile'
            root:
              - '.github/**'
              - 'justfile'
              - 'scripts/**'

  root-checks:
    name: Root checks (betterleaks, cspell, biome)
    runs-on: ubuntu-latest
    needs: detect-changes
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache cspell results
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cspellcache
          key: ${{ runner.os }}-cspell-${{ hashFiles('.cspell.yml', 'package.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-cspell-

      # Full-history scan, the same image and pin as lefthook.yml and `just check-security`.
      - name: Run betterleaks
        run: >-
          docker run --rm --user "$(id -u):$(id -g)"
          -v "$PWD":/repo -w /repo ghcr.io/betterleaks/betterleaks:v1.9.0@sha256:e3b95b0db6c2735db17165c009b0ad6d9cef34fb4578659232b98f69d7346cac
          git --config .betterleaks.toml --redact --no-banner

      - name: Run root checks
        run: pnpm run check

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install frontend deps
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Run frontend lint
        run: pnpm --dir frontend run lint

      - name: Run frontend type-check
        run: pnpm --dir frontend run type-check

      # Generate coverage for Codecov without gating CI on vitest's local
      # thresholds (Codecov owns coverage tracking); mirrors the backend's
      # --cov-fail-under=0.
      - name: Run frontend unit tests
        run: >-
          pnpm --dir frontend exec vitest run --coverage
          --coverage.thresholds.lines=0
          --coverage.thresholds.functions=0
          --coverage.thresholds.branches=0
          --coverage.thresholds.statements=0

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./frontend/coverage/lcov.info
          flags: frontend

  a11y:
    name: Accessibility (axe)
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install frontend deps
        run: pnpm --dir frontend install --frozen-lockfile

      # Frontend-only axe checks (Home, Settings, component library) — no
      # backend, so only the Chromium browser is needed.
      - name: Install Playwright Chromium
        run: pnpm --dir frontend exec playwright install --with-deps chromium

      - name: Run accessibility checks
        run: pnpm --dir frontend run test:e2e:a11y

  e2e:
    name: End-to-end tests (Playwright)
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.backend == 'true'
    timeout-minutes: 20
    # The backend's defaults (ENV=dev, no env file) point at localhost with
    # these credentials, so the services need no extra backend config.
    services:
      database:
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: scribbles_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      cache:
        image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install frontend deps
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Install backend deps
        working-directory: backend
        run: uv sync --group dev

      - name: Run database migrations
        working-directory: backend
        run: uv run alembic upgrade head

      # The drawing-submit test plays a round, which deals server-side cards.
      - name: Seed the card decks
        working-directory: backend
        run: uv run python -m scripts.seed_data

      # Only tests tagged @cross-browser run in Firefox and WebKit, and none are
      # tagged today, so Chromium is the only browser the suite launches.
      - name: Install Playwright Chromium
        run: pnpm --dir frontend exec playwright install --with-deps chromium

      # playwright.config.ts starts the backend and `vite preview` itself when CI is set.
      - name: Run end-to-end tests
        run: pnpm --dir frontend run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  backend:
    name: Backend checks + unit tests
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Backend checks + unit tests (composite)
        uses: ./.github/actions/backend-check
        with:
          run-tests-mode: 'unit'

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./backend/coverage.xml
          flags: backend-unit

  contracts:
    name: Contract generation checks
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.contracts == 'true'
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Setup just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          # A set version, not whatever is newest. Dependabot can't move this input: bump it by hand.
          just-version: "1.58.0"

      - name: Install root/frontend deps
        run: pnpm install --frozen-lockfile

      - name: Install backend deps
        working-directory: backend
        run: uv sync --all-groups

      - name: Check generated contracts
        run: pnpm run contracts:check

  backend-integration:
    name: Backend integration tests
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.root == 'true'
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Backend full tests (composite)
        uses: ./.github/actions/backend-check
        with:
          run-tests-mode: 'all'

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./backend/coverage.xml
          flags: backend-integration

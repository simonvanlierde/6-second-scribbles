name: licenses

# Lists the license of every dependency in the backend's uv environment and the pnpm
# workspace, and fails on a strong-copyleft one (GPL, AGPL, SSPL) that cannot ship under
# the repo's MIT license. LGPL and MPL pass: both allow use as an unmodified dependency.
on:
  push:
    branches: [main]
    paths: [.github/workflows/licenses.yml, backend/uv.lock, pnpm-lock.yaml]
  pull_request:
    paths: [.github/workflows/licenses.yml, backend/uv.lock, pnpm-lock.yaml]
  schedule:
    - cron: "17 5 * * 2" # Tuesdays, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # `[^L]GPL` keeps LGPL out; a license string that starts with GPL has no character before it.
  DENIED: '(^|[^L])GPL|AGPL|SSPL|GNU General Public|GNU Affero'

jobs:
  python:
    name: Python licenses
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: List licenses
        working-directory: backend
        run: |
          uv sync --all-groups --frozen
          uv run --with pip-licenses==5.5.5 pip-licenses --format=json --output-file="$RUNNER_TEMP/py.json"
          jq -r '.[] | "\(.License)\t\(.Name)"' "$RUNNER_TEMP/py.json" | sort
      - name: Fail on an incompatible license
        run: |
          bad=$(jq -r --arg re "$DENIED" '.[] | select(.License | test($re)) | "\(.Name): \(.License)"' "$RUNNER_TEMP/py.json")
          [ -z "$bad" ] || { echo "::error::Incompatible license:"; echo "$bad"; exit 1; }

  pnpm:
    name: pnpm licenses
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - name: List licenses
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm licenses list --json > "$RUNNER_TEMP/js.json"
          jq -r 'to_entries[] | .key as $l | .value[] | "\($l)\t\(.name)"' "$RUNNER_TEMP/js.json" | sort
      - name: Fail on an incompatible license
        run: |-
          bad=$(jq -r --arg re "$DENIED" 'to_entries[] | select(.key | test($re)) | .key as $l | .value[] | "\(.name): \($l)"' "$RUNNER_TEMP/js.json")
          [ -z "$bad" ] || { echo "::error::Incompatible license:"; echo "$bad"; exit 1; }

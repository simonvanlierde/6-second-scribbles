# No automerge: that needs a workflow with contents:write.
#
# `cooldown` holds a version update back until the release has been public for a
# week, long enough for a compromised release to be caught and yanked, and a major
# for a month. Security updates ignore it. github-actions, pre-commit and the
# docker ecosystems take default-days only.
version: 2
updates:
  # The composite actions under .github/actions pin actions too, and a bare `/`
  # reads only .github/workflows.
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule: {interval: weekly}
    cooldown: {default-days: 7}
    groups:
      actions: {patterns: ["*"]}

  # Version updates only. Dependabot has no security updates for this ecosystem.
  # Hook revs group wholesale: all dev tooling.
  - package-ecosystem: pre-commit
    directory: /
    schedule: {interval: weekly}
    cooldown: {default-days: 7}
    groups:
      hooks: {patterns: ["*"]}

  # Dev tooling lands as one PR and runtime minor and patch bumps as another, so a risky
  # bump is not buried in lint-tool churn. A runtime major gets its own PR. Advisories ignore the version-update groups,
  # so the security group keeps them to one PR and one CI run per ecosystem.
  - package-ecosystem: npm
    directory: /
    schedule: {interval: weekly}
    cooldown: {default-days: 7, semver-major-days: 30}
    groups:
      runtime:
        dependency-type: production
        update-types: [minor, patch]
        patterns: ["*"]
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
        patterns: ["*"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /backend
    schedule: {interval: weekly}
    cooldown: {default-days: 7, semver-major-days: 30}
    groups:
      runtime:
        dependency-type: production
        update-types: [minor, patch]
        patterns: ["*"]
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
        patterns: ["*"]
      uv-security:
        applies-to: security-updates
        patterns: ["*"]

  # Base images in both Docker builds and the service images in compose. The images
  # run in production, so they stay here. Majors stay manual: a new Postgres major
  # needs a dump and restore.
  - package-ecosystem: docker
    directories: ["/backend", "/frontend"]
    schedule: {interval: weekly}
    cooldown: {default-days: 7}
    groups:
      docker-images: {patterns: ["*"]}
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # ctranslate2 has no cp315 wheels yet; see backend/.python-version.
      - dependency-name: python
        versions: [">=3.15"]

  - package-ecosystem: docker-compose
    directory: /
    schedule: {interval: weekly}
    cooldown: {default-days: 7}
    groups:
      compose-images: {patterns: ["*"]}
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: [ "*" ]
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      npm-deps:
        patterns: [ "*" ]
      # Advisories arrive outside the weekly window and ignore the groups above,
      # so without this each one opens its own pull request and its own CI run.
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: [ "version-update:semver-major" ]

  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: monthly
    groups:
      uv-deps:
        patterns: [ "*" ]
      # Advisories arrive outside the weekly window and ignore the groups above,
      # so without this each one opens its own pull request and its own CI run.
      uv-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: [ "version-update:semver-major" ]
    cooldown:
      default-days: 7

  # Base images in both Docker builds and the service images in compose. Majors stay
  # manual: a new Postgres major needs a dump and restore.
  - package-ecosystem: docker
    directories: [ "/backend", "/frontend" ]
    schedule:
      interval: monthly
    groups:
      docker-images:
        patterns: [ "*" ]
    ignore:
      - dependency-name: "*"
        update-types: [ "version-update:semver-major" ]
      # ctranslate2 has no cp315 wheels yet; see backend/.python-version.
      - dependency-name: python
        versions: [ ">=3.15" ]
    cooldown:
      default-days: 7

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    groups:
      compose-images:
        patterns: [ "*" ]
    ignore:
      - dependency-name: "*"
        update-types: [ "version-update:semver-major" ]
    cooldown:
      default-days: 7

# compose.yml - Base Docker Compose configuration for all environments

services:

  backend:
    build:
      context: ./backend
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
    environment:
      POSTGRES_HOST: database
      REDIS_HOST: cache
    healthcheck:
      # Python, not curl: the image ships no curl. urlopen raises on a non-2xx status,
      # and /api/health answers 503 while the database or Redis is down. With Redis down
      # the answer takes about 5 s (the Redis client's connect wait), so wait 8 s for it.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=8)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  cache:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 30s

  database:
    image: postgres:18-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 30s

  database-migrations:
    build:
      context: ./backend
      target: db-migrations
    depends_on:
      database:
        condition: service_healthy
    environment:
      POSTGRES_HOST: database

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:

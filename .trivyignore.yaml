# Trivy ignore file for the image scan in .github/workflows/ci.yml.
# Each entry names one advisory and the one binary it is accepted for, says why, and
# expires, so the weekly scan fails again if no fixed image has arrived by then.
# Remove an entry as soon as `caddy:2.11-alpine` ships a Caddy built with the fix.

vulnerabilities:
  # golang.org/x/net 0.60.0 in Caddy v2.11.9; fixed in x/net 0.62.0.
  - id: CVE-2026-78661
    paths:
      - usr/bin/caddy
    statement: >-
      Denial of service from crafted HTML input to golang.org/x/net/html. Not reachable
      here: Caddy v2.11.9 imports it only through modules/caddypki (smallstep
      cli-utils/usage, which renders CLI help), and this Caddyfile runs no PKI, ACME
      server or TLS. reverse_proxy and file_server pass bodies through unparsed.
    expired_at: 2026-11-30

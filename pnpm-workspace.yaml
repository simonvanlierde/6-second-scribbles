# spell-checker: ignore jqrq, pmpm, smol, katex
packages:
  - frontend

# Resolve only releases at least a week old (in minutes), as Dependabot's cooldown has
# it: a compromised release is usually caught and yanked within that window.
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  # Security fix (alerts 106-109), a week old on 2026-10-26 at 23:05 UTC: drop after that.
  - fast-uri@3.1.9

overrides:
  undici: ^7.28.0
  fast-uri: ^3.1.2
  ws: ^8.21.0
  js-cookie: ^3.0.7
  "@babel/core": ^7.29.6
  postcss: ^8.5.10
  js-yaml: ^4.2.0
  markdown-it: ^14.3.3
  esbuild: ^0.28.1
  # GHSA-r4xh-jqrq-34v2: markdownlint-cli2 0.23.3 pins smol-toml 1.8.0. Drop once it ships >=1.9.0.
  smol-toml: ^1.9.0
  # GHSA-238p-pmpm-9mq7: micromark-extension-math 3.1.0 (via markdownlint) asks for ^0.16. Drop once it allows >=0.18.2.
  katex: 0.18.10 # 0.18.11 is deprecated upstream for breaking changes

# spell-checker: ignore gcqx, jqrq, pmpm, smol, katex
packages:
  - frontend

# Resolve only releases at least a week old (in minutes), as Dependabot's cooldown has
# it: a compromised release is usually caught and yanked within that window.
minimumReleaseAge: 10080

overrides:
  # GHSA-gcqx-w48m-w2h4: remove this override and its patch once the plugin drops deepmerge.
  "@sveltejs/vite-plugin-svelte@7.3.1>deepmerge": npm:@fastify/deepmerge@^3.2.4
  undici: ^7.28.0
  fast-uri: ^3.1.2
  ws: ^8.21.0
  js-cookie: ^3.0.7
  "@babel/core": ^7.29.6
  postcss: ^8.5.10
  js-yaml: ^4.2.0
  markdown-it: ^14.3.3
  esbuild: ^0.28.1
  # GHSA-238p-pmpm-9mq7: micromark-extension-math 3.1.0 (via markdownlint) asks for ^0.16. Drop once it allows >=0.18.2.
  katex: 0.18.10 # 0.18.11 is deprecated upstream for breaking changes

patchedDependencies:
  '@sveltejs/vite-plugin-svelte@7.3.1': patches/@sveltejs__vite-plugin-svelte@7.3.1.patch
